<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Honryn</title>

  <!-- PWA / iOS -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0D0D12" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Honryn" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <button id="btn-home" class="btn-icon" aria-label="Accueil">⌂</button>
      <h1 class="logo">HONRYN</h1>
      <button id="btn-settings" class="btn-icon" aria-label="Paramètres">⚙</button>
    </header>

    <!-- ===== ÉCRAN D'ACCUEIL ===== -->
    <main id="screen-home" class="screen active">
      <p class="tagline">Choisis ton mode, laisse le hasard faire le reste.</p>
      <div class="mode-grid">
        <button class="mode-card" data-mode="action-verite">
          <span class="mode-icon">🎭</span>
          <span class="mode-title">Action ou Vérité</span>
          <span class="mode-desc">4 niveaux · Cartes à retourner</span>
        </button>
        <button class="mode-card" data-mode="roue">
          <span class="mode-icon">🎡</span>
          <span class="mode-title">Roue des plaisirs</span>
          <span class="mode-desc">3 difficultés · Tirage animé</span>
        </button>
      </div>
      <div class="consent-note">
        <span>🔒</span>
        <p>Contenu réservé aux adultes consentants. Respecte les limites de chacun·e.</p>
      </div>
    </main>

    <!-- ===== ÉCRAN ACTION OU VÉRITÉ ===== -->
    <main id="screen-av" class="screen">
      <div class="level-selector" id="av-levels">
        <button class="chip active" data-level="soft">Soft</button>
        <button class="chip" data-level="chaud">Chaud</button>
        <button class="chip" data-level="sexy">Sexy</button>
        <button class="chip" data-level="hardcore">Hardcore</button>
      </div>

      <div class="card-stage">
        <div id="av-card" class="card">
          <div class="card-face card-front">
            <span class="card-type">Prêt·e ?</span>
            <p class="card-text">Choisis Action ou Vérité</p>
          </div>
          <div class="card-face card-back">
            <span class="card-type" id="card-type-label">Action</span>
            <p class="card-text" id="card-text">…</p>
          </div>
        </div>
      </div>

      <div class="action-buttons">
        <button id="btn-action" class="btn btn-primary">Action</button>
        <button id="btn-verite" class="btn btn-secondary">Vérité</button>
      </div>
      <button id="btn-pass" class="btn btn-ghost">Passer (pénalité douce)</button>
    </main>

    <!-- ===== ÉCRAN ROUE ===== -->
    <main id="screen-wheel" class="screen">
      <div class="level-selector" id="wheel-levels">
        <button class="chip active" data-level="soft">Soft</button>
        <button class="chip" data-level="medium">Medium</button>
        <button class="chip" data-level="hard">Hard</button>
      </div>

      <div class="wheel-wrapper">
        <div id="wheel-container" class="wheel-container"></div>
        <div class="wheel-pointer"></div>
      </div>

      <button id="btn-spin" class="btn btn-primary btn-large">Tourner la roue</button>
      <p id="wheel-result" class="wheel-result"></p>
    </main>

    <!-- ===== MODAL RÉSULTAT / PARAMÈTRES ===== -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <button id="modal-close" class="modal-close" aria-label="Fermer">×</button>
        <div id="modal-body"></div>
      </div>
    </div>

  </div>

  <!-- Roue (CDN, légère et sans dépendance) -->
  <script src="https://cdn.jsdelivr.net/npm/spin-wheel@5.0.2/dist/spin-wheel-iife.js"></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
